<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Frontier — Orbital Survival</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040b;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    .hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px;
      color: white;
      pointer-events: none;
      z-index: 10;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #3aa8ff;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.7;
    }

    .owner {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      color: #8ecbff;
      font-size: 12px;
      pointer-events: auto;
    }

    .owner a {
      color: inherit;
      text-decoration: none;
    }

    .owner a:hover {
      text-decoration: underline;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      letter-spacing: 3px;
      z-index: 5;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <div class="loading" id="loading">
    INITIALIZING ORBITAL SYSTEM...
  </div>

  <div class="hud">
    <div class="title">LAST FRONTIER</div>
    <div class="subtitle">ORBITAL SURVIVAL</div>
  </div>

  <div class="owner">
    <a href="https://g.dev/satyamshukla" target="_blank" rel="noopener">
      Satyam Pramod Shukla
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );

    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    document.getElementById("game").appendChild(renderer.domElement);

    // Space background
    scene.background = new THREE.Color(0x02040b);

    // Stars
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 1800;
    const positions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 500;
      positions[i + 1] = (Math.random() - 0.5) * 500;
      positions[i + 2] = (Math.random() - 0.5) * 500;
    }

    starGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const starMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.7
    });

    const stars = new THREE.Points(
      starGeometry,
      starMaterial
    );

    scene.add(stars);

    // Simple player ship
    const ship = new THREE.Group();

    const bodyGeometry = new THREE.ConeGeometry(
      0.45,
      1.8,
      4
    );

    const bodyMaterial = new THREE.MeshBasicMaterial({
      color: 0x5bbcff,
      wireframe: false
    });

    const body = new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );

    body.rotation.x = Math.PI / 2;
    ship.add(body);

    // Engine glow
    const engineGeometry = new THREE.SphereGeometry(
      0.18,
      16,
      16
    );

    const engineMaterial = new THREE.MeshBasicMaterial({
      color: 0xff6a24
    });

    const engine = new THREE.Mesh(
      engineGeometry,
      engineMaterial
    );

    engine.position.z = 0.9;
    ship.add(engine);

    scene.add(ship);

    let time = 0;

    function animate() {
      requestAnimationFrame(animate);

      time += 0.01;

      stars.rotation.y += 0.00015;

      ship.position.y = Math.sin(time) * 0.08;
      ship.rotation.z = Math.sin(time * 0.8) * 0.04;

      renderer.render(scene, camera);
    }

    animate();

    setTimeout(() => {
      document.getElementById("loading").style.display = "none";
    }, 1200);

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>

</body>
</html>
